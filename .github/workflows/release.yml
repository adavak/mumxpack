name: build-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Build MumxPack.exe
        shell: cmd
        run: build.cmd

      - name: Create zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          Compress-Archive -Path "dist\MumxPack.exe" -DestinationPath "MumxPack-$version-win64.zip" -Force
          Get-Item "MumxPack-$version-win64.zip" | Select-Object Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MumxPack-win64
          path: MumxPack-*-win64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: MumxPack ${{ github.ref_name }}
          body: |
            MumxPack ${{ github.ref_name }}

            Windows x64 single-file executable.

            Bundled wimlib 1.14.5 (GPLv3+):
            - https://wimlib.net/
            - https://github.com/ebiggers/wimlib
            - see vendor/COPYING and vendor/NOTICE.txt in the repository
          files: MumxPack-*-win64.zip
